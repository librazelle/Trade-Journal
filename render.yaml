services:
  - type: web
    name: trade-lens
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: TL_DISPLAY_TZ
        value: Asia/Jakarta
      - key: TL_ENABLE_WORKER
        value: "1"
