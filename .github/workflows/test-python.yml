name: Test Trade-Lens

on:
  pull_request:
    paths:
      - "app/**"
      - "test_*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "test_*.py"
      - "requirements.txt"
      - ".github/workflows/test-python.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
