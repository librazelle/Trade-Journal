<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1219">
  <meta name="description" content="Trade-Lens local-first trading journal and market research.">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/trade-lens-icon.svg" type="image/svg+xml">
  <title>{% block title %}trade-lens{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">trade-lens</a>
    <nav class="toolbar" aria-label="Trading toolbar">
      <details class="toolbar-menu">
        <summary>External Research</summary>
        <div class="toolbar-dropdown">
          <a href="/research">Research Library <span aria-hidden="true">↗</span></a>
          <a href="https://www.bls.gov/schedule/" target="_blank" rel="noopener noreferrer">BLS release schedule <span aria-hidden="true">↗</span></a>
        </div>
      </details>
      <details class="session-menu" id="session-menu"><summary aria-label="Buka pilihan jam sesi dan drawdown">Sesi &amp; waktu <span aria-hidden="true">⌄</span></summary>
      <div class="session-menu-popover"><div class="market-clock" id="market-clock" aria-label="Jam sesi dan drawdown">
        <div class="clock-options" role="group" aria-label="Pilihan informasi">
          <button type="button" data-clock-view="drawdown" aria-pressed="true">Drawdown</button>
          <button type="button" data-clock-view="asia" aria-pressed="false">Asia</button>
          <button type="button" data-clock-view="europe" aria-pressed="false">Eropa</button>
          <button type="button" data-clock-view="newyork" aria-pressed="false">New York</button>
        </div>
        <div class="clock-readout" id="clock-readout" aria-live="polite">
          <span class="clock-label">Drawdown tracker</span>
          <span class="clock-main">Masukkan balance dan equity</span>
        </div>
      </div></div>
      </details>
      <span class="tz">WIB · Asia/Jakarta</span>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block page_scripts %}{% endblock %}
  <script src="/static/app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/static/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
